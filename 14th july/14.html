<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="./14.css">
<body>
    <section id="heading">E-COMMERCE STORE</section>
    <section id="ribbon">
        <div id="filterbox">
                <label class="ribbonOptions1" for="filter" style="font-weight: bold;">FILTER:</label>
                <select class="ribbonOptions2" id="filter">
                    <option value="All categories">ALL CATEGORIES</option>
                </select>
            </div>
            <div id="searchbox">
                <label class="ribbonOptions1" for="search" style="font-weight: bold;">SEARCH:</label>
                <input class="ribbonOptions2" type="text" id="search">
            </div>
            <div id="sorting">
                <label class="ribbonOptions1" for="sort" style="font-weight: bold;">SORT:</label>
                <select class="ribbonOptions2" id="sort">                    
                    <option value="DEFAULT">DEFAULT</option>
                    <option value="PRICE HIGH TO LOW">PRICE HIGH TO LOW</option>
                    <option value="PRICE LOW TO HIGH">PRICE LOW TO HIGH</option>
                    <option value="RATING LOW TO HIGH">RATING LOW TO HIGH</option>
                    <option value="RATING HIGH TO LOW">RATING HIGH TO LOW</option>
                </select>
            </div>
            <div id="cart">
                <button class="ribbonOptions2" id="cartButton">CART</button>
            </div>
        </div>
    </section>
    <section id="content">

    </section>
    <div id="modal">
                <div id="modalContent">
                    <button type="button" id="close">X</button>
            </div>
</body>
<script src="./14.js"></script>
</html>
